<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>枯山水 — karesansui</title>
<style>
  :root {
    --sand: #d9d6cf;
    --sand-deep: #cbc7be;
    --ink: #2c2b27;
    --ink-soft: #605d55;
    --line: #b9b5aa;
    --accent: #6d7560;
    --paper: #f1efe9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--sand);
    color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
  }
  #garden { display: block; cursor: default; }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: baseline; gap: 14px;
    padding: 22px 28px; pointer-events: none;
  }
  header h1 { font-size: 22px; font-weight: 500; letter-spacing: .35em; }
  header .sub { font-size: 12px; color: var(--ink-soft); letter-spacing: .12em; }
  header .count { font-size: 12px; color: var(--ink-soft); }

  #search {
    position: fixed; top: 18px; right: 28px; width: 220px;
    padding: 7px 12px; font: inherit; font-size: 13px;
    background: transparent; color: var(--ink);
    border: none; border-bottom: 1px solid var(--line);
    outline: none; transition: border-color .25s, width .25s;
  }
  #search:focus { border-color: var(--ink-soft); width: 280px; }
  #search::placeholder { color: #b3a98f; letter-spacing: .1em; }

  #legend {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; flex-wrap: wrap; gap: 4px 22px;
    padding: 16px 28px; font-size: 12px; color: var(--ink-soft);
  }
  #legend span { cursor: pointer; letter-spacing: .08em; transition: color .2s; }
  #legend span:hover, #legend span.active { color: var(--ink); }
  #legend i { font-style: normal; opacity: .6; margin-left: 4px; font-size: 11px; }

  #tip {
    position: fixed; pointer-events: none; display: none;
    max-width: 300px; padding: 10px 14px;
    background: var(--paper); border: 1px solid var(--line);
    box-shadow: 2px 3px 0 rgba(90,80,60,.08);
    font-size: 12.5px; line-height: 1.55; z-index: 5;
  }
  #tip .t { font-size: 13.5px; }
  #tip .d { color: var(--ink-soft); font-size: 11px; margin-top: 2px; letter-spacing: .05em; }
  #tip .e { color: var(--ink-soft); margin-top: 6px; }

  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 92vw);
    background: var(--paper); border-left: 1px solid var(--line);
    transform: translateX(102%); transition: transform .3s cubic-bezier(.2,.7,.2,1);
    display: flex; flex-direction: column; z-index: 10;
    box-shadow: -6px 0 24px rgba(80,70,50,.07);
  }
  #panel.open { transform: translateX(0); }
  #panel .bar {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 22px 12px; border-bottom: 1px solid var(--line);
  }
  #panel .bar .path { font-size: 11px; color: var(--ink-soft); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1; letter-spacing: .03em; }
  #panel .bar button {
    border: none; background: none; font: inherit; font-size: 18px;
    color: var(--ink-soft); cursor: pointer; line-height: 1;
  }
  #panel .bar button:hover { color: var(--ink); }
  #content { padding: 24px 28px 60px; overflow-y: auto; line-height: 1.85; font-size: 14.5px; }
  #content h1 { font-size: 21px; margin: 0 0 14px; font-weight: 600; }
  #content h2 { font-size: 17px; margin: 26px 0 8px; font-weight: 600;
    border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  #content h3 { font-size: 15px; margin: 18px 0 6px; font-weight: 600; }
  #content p { margin: 10px 0; }
  #content ul, #content ol { margin: 8px 0 8px 22px; }
  #content li { margin: 3px 0; }
  #content blockquote { border-left: 3px solid var(--line); padding-left: 14px;
    color: var(--ink-soft); margin: 10px 0; }
  #content code { font-family: ui-monospace, Menlo, monospace; font-size: .88em;
    background: var(--sand-deep); padding: 1px 5px; }
  #content pre { background: var(--sand-deep); padding: 12px 14px; overflow-x: auto; margin: 12px 0; }
  #content pre code { background: none; padding: 0; }
  #content a { color: var(--accent); }
  #content hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
  #content .fm { font-size: 11px; color: var(--ink-soft); background: var(--sand-deep);
    padding: 8px 12px; margin-bottom: 16px; white-space: pre-wrap; }

  #empty {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; color: var(--ink-soft); text-align: center;
  }
  #empty .big { font-size: 40px; letter-spacing: .3em; color: var(--line); }

  :root { --sand: #e5e1d8; --sans: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif; }
  header { padding: 28px 36px 54px; background: linear-gradient(var(--sand) 40%, transparent); }
  header .sub, header .count, #search, #legend, .d, .path, .note-meta, #search-state { font-family: var(--sans); }
  header .sub { max-width: 24vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #search { top: 24px; right: 36px; }
  #search::placeholder { color: var(--ink-soft); }
  #search-state { position: fixed; top: 67px; right: 36px; font-size: 11px; color: var(--ink-soft); display: flex; gap: 14px; align-items: center; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #reset { background: none; border: 0; text-decoration: underline; min-height: 32px; }
  [hidden] { display: none !important; }
  #legend { padding: 35px 36px 18px; background: linear-gradient(transparent, var(--sand) 45%); gap: 4px 24px; }
  #legend button { border: 0; border-bottom: 2px solid transparent; background: none; padding: 10px 0; font-size: 13px; letter-spacing: .06em; }
  #legend button.active { color: #4e6044; border-bottom-color: var(--accent); }
  #legend button:hover { color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  #search:focus-visible { outline: 2px solid var(--accent); }
  #panel { visibility: hidden; transition: transform .3s cubic-bezier(.2,.7,.2,1), visibility .3s; }
  #panel.open { visibility: visible; }
  #panel .bar button { min-width: 44px; min-height: 44px; }
  #content { overflow-wrap: anywhere; padding: 28px 32px 60px; }
  #content .note-title { font-size: 25px; font-weight: 500; line-height: 1.5; }
  .note-meta { font-size: 12px; color: var(--ink-soft); margin-bottom: 24px; line-height: 1.8; }
  #content .fm { background: transparent; border-bottom: 1px solid var(--line); white-space: normal; padding: 10px 0; }
  .fm summary { cursor: pointer; font-family: var(--sans); }
  #content .fm pre { white-space: pre-wrap; }
  #no-results { position: fixed; top: 48%; left: 50%; transform: translate(-50%, -50%); background: var(--paper); padding: 22px 28px; text-align: center; line-height: 1.9; pointer-events: none; }
  #no-results small { color: var(--ink-soft); }
  @media (max-width: 640px) {
    header { padding: 20px 22px 90px; gap: 10px; }
    header h1 { font-size: 21px; }
    header .sub { max-width: 32vw; }
    #search, #search:focus { top: 66px; left: 22px; right: 22px; width: calc(100% - 44px); font-size: 16px; }
    #search-state { top: 110px; left: 22px; right: 22px; justify-content: space-between; }
    #legend { flex-wrap: nowrap; overflow-x: auto; padding: 28px 22px calc(12px + env(safe-area-inset-bottom)); }
    #legend button { flex: 0 0 auto; min-height: 44px; }
    #panel { top: auto; height: 72dvh; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; transform: translateY(102%); }
    #panel.open { transform: translateY(0); }
    #content { padding: 20px 24px calc(40px + env(safe-area-inset-bottom)); font-size: 16px; }
    #tip { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) { *, #panel { transition: none !important; } }
</style>
</head>
<body>
<canvas id="garden" tabindex="0" aria-label="ノートの庭。左右矢印で石を選び、Enterで開く"></canvas>
<header>
  <h1>枯山水</h1>
  <span class="sub" id="rootname"></span>
  <span class="count" id="count"></span>
</header>
<input id="search" type="text" placeholder="庭のノートを探す  /" aria-label="庭のノートを検索" autocomplete="off">
<div id="search-state"><span id="result-count" role="status" aria-live="polite"></span><button id="reset" hidden>絞り込みを解除</button></div>
<nav id="legend" aria-label="カテゴリ"></nav>
<div id="no-results" hidden>見つかりませんでした<br><small>言葉やカテゴリを変えてみてください</small></div>
<div id="tip"></div>
<aside id="panel" aria-label="ノート本文" inert>
  <div class="bar">
    <span class="path" id="ppath"></span>
    <button id="pclose" title="閉じる" aria-label="ノートを閉じる">×</button>
  </div>
  <div id="content" aria-live="polite"></div>
</aside>
<div id="empty">
  <div class="big">無</div>
  <div>この庭にはまだノートがありません。<br>Markdownのあるフォルダを指定してください。</div>
  <code>python3 server.py ~/your/notes</code>
</div>

<script>
"use strict";

/* ---------- deterministic randomness ---------- */
function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* ---------- state ---------- */
const canvas = document.getElementById("garden");
const ctx = canvas.getContext("2d");
let DPR = 1, W = 0, H = 0;
let garden = null;          // api payload
let clusters = [];          // {name, cx, cy, r, count, stones:[]}
let stones = [];            // {x, y, r, entry, cluster, shade}
let hovered = null;
let selectedId = null;
let requestId = 0;
let returnFocus = null;
let query = "";
let activeCategory = null;

/* ---------- layout ---------- */
function layout() {
  clusters = []; stones = [];
  if (!garden || !garden.entries.length) return;

  const rand = mulberry32(garden.seed);
  const byCat = new Map();
  for (const e of garden.entries) {
    if (!byCat.has(e.category)) byCat.set(e.category, []);
    byCat.get(e.category).push(e);
  }
  const cats = [...byCat.entries()].sort((a, b) => b[1].length - a[1].length);

  const mobile = W <= 640;
  const mTop = mobile ? 165 : 130, mBot = 105, mSide = mobile ? 24 : 80;
  const usableW = Math.max(80, W - mSide * 2), usableH = Math.max(80, H - mTop - mBot);
  const total = garden.entries.length;

  // place cluster centers with rejection sampling (deterministic)
  const centers = [];
  for (const [name, list] of cats) {
    const frac = Math.sqrt(list.length / total);
    const r = Math.max(20, Math.min(usableW, usableH) * (mobile ? 0.18 : 0.23) * frac + (mobile ? 10 : 24));
    let best = null, bestScore = -Infinity;
    for (let attempt = 0; attempt < 140; attempt++) {
      const x = mSide + r + rand() * (usableW - 2 * r);
      const y = mTop + r + rand() * (usableH - 2 * r);
      let minD = Infinity;
      for (const c of centers) minD = Math.min(minD, Math.hypot(x - c.cx, y - c.cy) - c.r - r);
      const score = centers.length ? minD : rand();
      if (score > bestScore) { bestScore = score; best = { x, y }; }
      if (minD > 72) break;
    }
    centers.push({ name, list, cx: best.x, cy: best.y, r });
  }

  const now = Date.now();
  for (const c of centers) {
    const cl = { name: c.name, cx: c.cx, cy: c.cy, r: c.r, count: c.list.length, stones: [] };
    const n = c.list.length;
    c.list.sort((a, b) => (a.date || "") < (b.date || "") ? -1 : 1);
    for (let i = 0; i < n; i++) {
      const e = c.list[i];
      const er = mulberry32(hashStr(e.path));
      const rad = c.r * 0.70 * Math.sqrt((i + 0.6) / n);
      const ang = i * 2.39996 + er() * 0.9;
      const x = c.cx + Math.cos(ang) * rad * (0.85 + er() * 0.3);
      const y = c.cy + Math.sin(ang) * rad * (0.85 + er() * 0.3);
      const density = Math.max(1, Math.min(2.1, 60 / total + 1));
      const size = Math.min(c.r * 0.5, (7 + Math.min(12, Math.log2(1 + e.size / 250) * 3)) * density);
      // newer entries are darker ink; undated sit mid-tone
      let age = 0.5;
      if (e.date) {
        const days = (now - new Date(e.date).getTime()) / 864e5;
        age = Math.max(0, Math.min(1, days / 720));
      }
      const stone = { x, y, r: size, entry: e, cluster: cl, age, rot: er() * Math.PI, blob: er() };
      cl.stones.push(stone); stones.push(stone);
    }
    clusters.push(cl);
  }
}

/* ---------- drawing ---------- */
let gravel = null;
function makeGravel() {
  const t = document.createElement("canvas");
  t.width = t.height = 180;
  const c = t.getContext("2d");
  c.fillStyle = "#e5e1d8";
  c.fillRect(0, 0, 180, 180);
  const rand = mulberry32((garden ? garden.seed : 7) ^ 0x9e3779);
  const img = c.getImageData(0, 0, 180, 180);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = (rand() - 0.5) * 18;
    img.data[i] += v; img.data[i + 1] += v; img.data[i + 2] += v * 0.96;
  }
  c.putImageData(img, 0, 0);
  // scattered pebbles catching light and shadow
  for (let i = 0; i < 220; i++) {
    const x = rand() * 180, y = rand() * 180, r = 0.4 + rand() * 1.5;
    c.fillStyle = rand() < 0.5 ? "rgba(255,255,255,0.18)" : "rgba(60,58,52,0.09)";
    c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }
  gravel = ctx.createPattern(t, "repeat");
}

// a raked furrow = dark groove + white gravel ridge just above it
function furrow(pathFn, dark, light) {
  ctx.strokeStyle = `rgba(56,54,48,${dark})`;
  ctx.lineWidth = 3;
  ctx.beginPath(); pathFn(0); ctx.stroke();
  ctx.strokeStyle = `rgba(255,255,255,${light})`;
  ctx.lineWidth = 1.7;
  ctx.beginPath(); pathFn(-2); ctx.stroke();
}

function drawSand() {
  if (!gravel) makeGravel();
  ctx.fillStyle = gravel;
  ctx.fillRect(0, 0, W, H);
  const gap = 19;
  for (let y = gap; y < H + gap; y += gap) {
    furrow(off => {
      for (let x = 0; x <= W; x += 18) {
        const yy = y + off + Math.sin(x * 0.006 + y * 0.31) * 2.2;
        x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
      }
    }, 0.065, 0.16);
  }
}

// Each island keeps its seeded character; outer contours taper toward neighbours.
function islandPoint(cl, a, extra) {
  const phase = hashStr(cl.name) / 4294967296 * Math.PI * 2;
  const shape = 1 + Math.sin(a * 3 + phase) * .07 + Math.cos(a * 2 - phase) * .09;
  let radius = (cl.r + extra) * shape;
  for (const other of clusters) {
    if (other === cl) continue;
    const dx = other.cx - cl.cx, dy = other.cy - cl.cy;
    const projection = dx * Math.cos(a) + dy * Math.sin(a);
    if (projection > 0) {
      const boundary = (dx * dx + dy * dy) / (2 * projection) - 8;
      const limit = Math.max(8, boundary);
      const blend = Math.max(0, 1 - Math.abs(radius - limit) / 18);
      radius = Math.min(radius, limit) - blend * blend * 4.5;
    }
  }
  return [cl.cx + Math.cos(a) * radius, cl.cy + Math.sin(a) * radius * .88];
}
function islandPath(cl, extra) {
  for (let i = 0; i <= 160; i++) {
    const [x, y] = islandPoint(cl, i / 160 * Math.PI * 2, extra);
    if (!i) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function drawClusterSand(cl, bedOnly = false) {
  const spacing = W <= 640 ? 7 : 11;
  if (bedOnly) {
    ctx.fillStyle = gravel;
    ctx.beginPath(); islandPath(cl, spacing * 4 + 8); ctx.fill();
    return;
  }
  for (let k = 4; k >= 0; k--) {
    const fade = (1 - k * .12) * (shouldDim(cl) ? .3 : 1);
    furrow(off => islandPath(cl, 8 + k * spacing + off), .17 * fade, .34 * fade);
  }
}
function drawClusterLabel(cl) {
  const y = cl.cy + cl.r * .88 + (W <= 640 ? 43 : 62);
  ctx.font = "13px 'Hiragino Kaku Gothic ProN',sans-serif";
  ctx.textAlign = "center";
  const width = ctx.measureText(cl.name).width + 20;
  ctx.fillStyle = "rgba(229,225,216,.88)";
  ctx.fillRect(cl.cx - width / 2, y - 14, width, 22);
  ctx.fillStyle = shouldDim(cl) ? "rgba(66,63,56,.35)" : "#605d55";
  ctx.fillText(cl.name, cl.cx, y);
}

function stonePath(s, scale) {
  const n = 9, pts = [];
  for (let i = 0; i < n; i++) {
    const a = s.rot + (i / n) * Math.PI * 2;
    const wob = 0.72 + 0.30 * Math.sin(a * 3 + s.blob * 9) * Math.cos(a * 2 - s.blob * 5);
    pts.push([s.x + Math.cos(a) * s.r * wob * scale,
              s.y + Math.sin(a) * s.r * wob * 0.82 * scale]);
  }
  ctx.beginPath();
  ctx.moveTo((pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2);
  for (let i = 1; i <= n; i++) {
    const p = pts[i % n], q = pts[(i + 1) % n];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  ctx.closePath();
}

function drawStone(s) {
  const matched = matches(s.entry);
  const dim = (query && !matched) || shouldDim(s.cluster);
  const isHover = hovered === s;
  const alpha = dim ? 0.15 : 1;
  const scale = isHover ? 1.22 : 1;
  const base = 30 + s.age * 52;          // newer = darker rock

  // soft cast shadow (sun from upper left)
  const sx = s.x + s.r * 0.35, sy = s.y + s.r * 0.4;
  const sh = ctx.createRadialGradient(sx, sy, s.r * 0.1, sx, sy, s.r * 1.35);
  sh.addColorStop(0, `rgba(28,27,23,${0.35 * alpha})`);
  sh.addColorStop(1, "rgba(28,27,23,0)");
  ctx.fillStyle = sh;
  ctx.beginPath(); ctx.arc(sx, sy, s.r * 1.35, 0, 7); ctx.fill();

  // body: top-lit gradient
  const g = ctx.createLinearGradient(s.x - s.r, s.y - s.r, s.x + s.r * 0.7, s.y + s.r);
  g.addColorStop(0, `rgba(${base + 78},${base + 76},${base + 68},${alpha})`);
  g.addColorStop(0.45, `rgba(${base + 20},${base + 18},${base + 12},${alpha})`);
  g.addColorStop(1, `rgba(${Math.max(8, base - 14)},${Math.max(8, base - 14)},${Math.max(6, base - 18)},${alpha})`);
  ctx.fillStyle = g;
  stonePath(s, scale); ctx.fill();

  // facets and weathering, clipped to the rock
  if (!dim) {
    ctx.save();
    stonePath(s, scale); ctx.clip();
    const fr = mulberry32(hashStr(s.entry.id));
    for (let f = 0; f < 3; f++) {
      const a0 = fr() * Math.PI * 2, a1 = a0 + 0.7 + fr() * 1.2;
      ctx.fillStyle = f === 0 ? "rgba(255,255,255,0.13)" : `rgba(0,0,0,${0.10 + fr() * 0.14})`;
      ctx.beginPath();
      ctx.moveTo(s.x + Math.cos(a0) * s.r * 0.1, s.y + Math.sin(a0) * s.r * 0.1);
      ctx.lineTo(s.x + Math.cos(a0) * s.r * 1.5, s.y + Math.sin(a0) * s.r * 1.5);
      ctx.lineTo(s.x + Math.cos(a1) * s.r * 1.5, s.y + Math.sin(a1) * s.r * 1.5);
      ctx.closePath(); ctx.fill();
    }
    // crown light
    ctx.save(); ctx.translate(-s.r * 0.16, -s.r * 0.22);
    stonePath(s, scale * 0.62);
    ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fill();
    ctx.restore();
    ctx.restore();
  }
  // contact edge
  ctx.strokeStyle = `rgba(18,17,14,${0.4 * alpha})`;
  ctx.lineWidth = 1;
  stonePath(s, scale); ctx.stroke();

  // moss fleck for tagged entries
  if (s.entry.tags && s.entry.tags.length && !dim) {
    ctx.fillStyle = "rgba(109,117,96,0.9)";
    ctx.save(); stonePath(s, scale); ctx.clip();
    for (let i = 0; i < 7; i++) {
      const a = -1.3 + i * .17;
      ctx.beginPath(); ctx.ellipse(s.x + Math.cos(a) * s.r * .55,
        s.y + Math.sin(a) * s.r * .53, s.r * (.13 + .03 * Math.sin(i * 4)), s.r * .09, a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  if (isHover || (selectedId === s.entry.id && !dim)) {
    ctx.strokeStyle = "rgba(44,43,39,0.55)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r + 8, 0, 7); ctx.stroke();
  }
}

function shouldDim(cl) { return activeCategory && cl.name !== activeCategory; }
function matches(e) {
  if (!query) return true;
  const q = query.toLowerCase();
  return e.title.toLowerCase().includes(q) || e.path.toLowerCase().includes(q) ||
         (e.excerpt || "").toLowerCase().includes(q) ||
         (e.tags || []).some(t => t.toLowerCase().includes(q)) ||
         (e.date || "").includes(q);
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSand();
  if (!garden || !garden.entries.length) return;
  for (const cl of clusters) drawClusterSand(cl, true);
  for (const cl of clusters) drawClusterSand(cl);
  // grain pass over the furrows to unify everything into one bed of gravel
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = gravel;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  for (const cl of clusters) drawClusterLabel(cl);
  for (const s of stones) if (!(hovered === s)) drawStone(s);
  if (hovered) drawStone(hovered);
}

/* ---------- markdown (tiny) ---------- */
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, (_, c) => "<code>" + c + "</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMd(src) {
  let fm = "";
  if (src.startsWith("---")) {
    const end = src.indexOf("\n---", 3);
    if (end !== -1) { fm = src.slice(4, end).trim(); src = src.slice(end + 4); }
  }
  const lines = esc(src).split("\n");
  const out = [];
  let inCode = false, listType = null;
  const closeList = () => { if (listType) { out.push("</" + listType + ">"); listType = null; } };
  for (const raw of lines) {
    if (raw.startsWith("```")) {
      closeList();
      out.push(inCode ? "</code></pre>" : "<pre><code>");
      inCode = !inCode; continue;
    }
    if (inCode) { out.push(raw); continue; }
    const line = raw.trimEnd();
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)/))) {
      closeList();
      const l = Math.min(m[1].length, 3);
      out.push(`<h${l}>` + inline(m[2]) + `</h${l}>`);
    } else if (/^(-{3,}|\*{3,})$/.test(line)) {
      closeList(); out.push("<hr>");
    } else if ((m = line.match(/^\s*[-*+]\s+(.*)/))) {
      if (listType !== "ul") { closeList(); out.push("<ul>"); listType = "ul"; }
      out.push("<li>" + inline(m[1]) + "</li>");
    } else if ((m = line.match(/^\s*\d+\.\s+(.*)/))) {
      if (listType !== "ol") { closeList(); out.push("<ol>"); listType = "ol"; }
      out.push("<li>" + inline(m[1]) + "</li>");
    } else if ((m = line.match(/^>\s?(.*)/))) {
      closeList(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>");
    } else if (line === "") {
      closeList();
    } else {
      closeList(); out.push("<p>" + inline(line) + "</p>");
    }
  }
  closeList();
  return (fm ? `<details class="fm"><summary>ノートの詳細</summary><pre>${esc(fm)}</pre></details>` : "") + out.join("\n");
}

/* ---------- interactions ---------- */
const tip = document.getElementById("tip");
const panel = document.getElementById("panel");

function visibleStone(s) { return matches(s.entry) && !shouldDim(s.cluster); }
function hitStone(x, y) {
  let best = null, distance = Infinity;
  for (const s of stones) {
    if (!visibleStone(s)) continue;
    const d = Math.hypot(x - s.x, y - s.y);
    if (d <= Math.max(24, s.r + 10) && d < distance) { best = s; distance = d; }
  }
  return best;
}
function clearHover() { hovered = null; tip.style.display = "none"; canvas.style.cursor = "default"; }
canvas.addEventListener("pointermove", ev => {
  if (ev.pointerType === "touch") return;
  const best = hitStone(ev.clientX, ev.clientY);
  if (hovered !== best) { hovered = best; render(); }
  canvas.style.cursor = best ? "pointer" : "default";
  if (!best) { tip.style.display = "none"; return; }
  const e = best.entry;
  tip.innerHTML = `<div class="t">${esc(e.title)}</div><div class="d">${e.date || "日付なし"} · ${esc(e.category)}</div><div class="e">${esc(e.excerpt || "")}</div>`;
  tip.style.display = "block";
  tip.style.left = Math.max(12, Math.min(ev.clientX + 18, W - tip.offsetWidth - 12)) + "px";
  tip.style.top = Math.max(12, Math.min(ev.clientY + 18, H - tip.offsetHeight - 12)) + "px";
});
canvas.addEventListener("pointerleave", () => { clearHover(); render(); });
function closePanel() {
  requestId++;
  panel.classList.remove("open"); panel.inert = true;
  selectedId = null; render();
  if (returnFocus) { returnFocus.focus({ preventScroll: true }); returnFocus = null; }
}
async function openStone(s) {
  const e = s.entry, currentRequest = ++requestId;
  if (!panel.classList.contains("open")) returnFocus = document.activeElement;
  selectedId = e.id; clearHover(); render();
  document.getElementById("ppath").textContent = e.path;
  const content = document.getElementById("content");
  content.textContent = "ノートを開いています…";
  panel.inert = false; panel.classList.add("open");
  document.getElementById("pclose").focus({ preventScroll: true });
  try {
    const res = await fetch("/api/file?path=" + encodeURIComponent(e.path));
    if (!res.ok) throw new Error("file unavailable");
    const data = await res.json();
    if (currentRequest !== requestId) return;
    const body = renderMd(data.content || "").replace(/<h1>.*?<\/h1>/, "");
    content.innerHTML = `<h1 class="note-title">${esc(e.title)}</h1><div class="note-meta">${e.date || "日付なし"} · ${esc(e.category)}${e.tags.length ? "<br>" + e.tags.map(t => "#" + esc(t)).join("　") : ""}</div>` + body;
    content.scrollTop = 0;
  } catch (err) {
    if (currentRequest === requestId) content.textContent = "ノートを読み込めませんでした。閉じて、もう一度石を選んでください。";
  }
}
canvas.addEventListener("click", ev => {
  const s = hitStone(ev.clientX, ev.clientY);
  if (s) openStone(s); else closePanel();
});
canvas.addEventListener("keydown", ev => {
  const visible = stones.filter(visibleStone);
  if (!visible.length) return;
  if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
    ev.preventDefault();
    const index = visible.indexOf(hovered);
    hovered = visible[(index + (ev.key === "ArrowRight" ? 1 : visible.length - 1) + visible.length) % visible.length];
    document.getElementById("result-count").textContent = hovered.entry.title;
    render();
  }
  if (ev.key === "Enter" && hovered) { ev.preventDefault(); openStone(hovered); }
});
document.getElementById("pclose").addEventListener("click", closePanel);
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { closePanel(); document.getElementById("search").blur(); }
  if (ev.key === "/" && document.activeElement !== document.getElementById("search")) {
    ev.preventDefault(); document.getElementById("search").focus();
  }
});
function updateFilters() {
  clearHover();
  if (selectedId && !stones.some(s => s.entry.id === selectedId && visibleStone(s))) closePanel();
  const count = stones.filter(visibleStone).length;
  document.getElementById("result-count").textContent = query || activeCategory ? `${stones.length}石のうち${count}石` : "石を選んで、ノートをひらく";
  document.getElementById("reset").hidden = !(query || activeCategory);
  document.getElementById("no-results").hidden = count > 0 || !stones.length;
  document.querySelectorAll("#legend button").forEach(el => {
    const active = el.dataset.category === activeCategory;
    el.classList.toggle("active", active); el.setAttribute("aria-pressed", String(active));
  });
  render();
}
document.getElementById("search").addEventListener("input", ev => { query = ev.target.value.trim(); updateFilters(); });
document.getElementById("reset").addEventListener("click", () => {
  query = ""; activeCategory = null; document.getElementById("search").value = "";
  updateFilters(); document.getElementById("search").focus();
});

/* ---------- boot ---------- */
function buildLegend() {
  const el = document.getElementById("legend");
  el.innerHTML = "";
  for (const cl of [...clusters].sort((a, b) => b.count - a.count)) {
    const sp = document.createElement("button");
    sp.innerHTML = esc(cl.name) + " <i>" + cl.count + "</i>";
    sp.dataset.category = cl.name;
    sp.setAttribute("aria-pressed", String(activeCategory === cl.name));
    sp.addEventListener("click", () => {
      activeCategory = activeCategory === cl.name ? null : cl.name;
      updateFilters();
    });
    el.appendChild(sp);
  }
}

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  clearHover(); layout(); render();
}
window.addEventListener("resize", resize);

async function boot() {
  try {
    const res = await fetch("/api/garden");
    garden = await res.json();
  } catch (e) {
    document.getElementById("empty").style.display = "flex";
    return;
  }
  document.getElementById("rootname").textContent = garden.root;
  document.getElementById("count").textContent = garden.entries.length + " 石";
  if (!garden.entries.length) document.getElementById("empty").style.display = "flex";
  resize();
  buildLegend();
  updateFilters();
}
boot();
</script>
</body>
